name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      # lint 排在装依赖之前：它不需要任何依赖，装依赖失败时仍能给出信号。
      - name: Lint
        run: ruff check .

      # 兄弟仓已全部公开，checkout 用 runner 自带的 GITHUB_TOKEN 即可，
      # 不再需要人工配 PAT。private 时代的 HAS_TOKEN 门禁已移除 ——
      # 那道门禁的代价是所有测试被 skip，绿灯只代表 lint 过。
      - name: Checkout sibling repos
        uses: actions/checkout@v7
        with:
          repository: hexonal/vnpy_gatewaykit
          path: _deps/vnpy_gatewaykit

      - name: Install package
        run: |
          pip install mypy pytest
          pip install -e _deps/vnpy_gatewaykit
          pip install -e .

      - name: Type check
        run: mypy --strict vnpy_agentbridge

      # 本仓不需要 QT_QPA_PLATFORM=offscreen：测试只碰 vnpy.event /
      # vnpy.trader.{engine,gateway,object,constant} 与 fastmcp 的进程内接口，
      # 不 import vnpy.trader.ui，实测整轮 pytest 结束时 PySide6/PyQt 模块加载数为 0。
      # 将来若有用例拉起 MainWindow/QApplication，再在这一步加 env 即可。
      #
      # 这一步是本 workflow 存在的主要理由：vnpy 与 vnpy_ctastrategy 的既有 CI
      # 只跑 ruff/mypy/build，一个用例都不执行。
      - name: Test
        run: pytest tests -q

