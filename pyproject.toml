[project]
name = "vnpy_agentbridge"
version = "0.1.0"
description = "IntentEngine + MCP Bridge Server for AI-Agent-assisted trading on top of a VeighNa (vnpy) fork."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "vnpy>=4.0.0",
    "fastmcp>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vnpy_agentbridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
